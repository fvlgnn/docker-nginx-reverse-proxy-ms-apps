name: Validate example

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: find app-be -name '*.json' -print0 | xargs -0 -n1 jq --exit-status empty

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build and start the example
        run: docker compose up --build --wait --wait-timeout 120

      - name: Test documented routes
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' \
            http://localhost:8000/)" = "http://localhost:8000/app-fe/"
          curl --fail --retry 5 --retry-connrefused http://localhost:8000/app-fe/
          curl --fail --retry 5 --retry-connrefused http://localhost:8000/app-be/v1/users/1
          curl --fail --retry 5 --retry-connrefused http://localhost:8000/app-be/v1/users
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://localhost:8000/app-be/v1/users)" = "201"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8000/app-be/unknown)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request DELETE http://localhost:8000/app-be/v1/users)" = "405"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: http://localhost:5173' \
            --header 'Access-Control-Request-Method: GET' \
            http://localhost:8000/app-be/v1/users)" = "204"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the example
        if: always()
        run: docker compose down --volumes
